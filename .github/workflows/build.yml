name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        run: dotnet publish src/GameRoot/GameRoot.csproj -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: GameRoot-win-x64
          path: publish/GameRoot.exe
