name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build src/GameRoot/GameRoot.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: GameRoot-win-x64
          path: |
            publish/GameRoot.exe
            publish/GameRoot.exe.config
